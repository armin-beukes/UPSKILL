---
# XP-P323B Mobile Transgression Slip — BarTender Designer Template Spec
# Tool: BarTender Designer with Seagull Scientific Xprinter XP-P323B driver
# Last updated: 2026-04-29

printer_settings:
  printer_name: "Xprinter XP-P323B"
  driver: "Seagull Scientific (Windows)"
  dpi: 203
  media_width_mm: 76
  printable_width_mm: 72
  media_type: Continuous
  orientation: Portrait
  page_width_mm: 72
  page_height_mm: 560          # approximate; stretches with charge count
  margin_left_mm: 2
  margin_right_mm: 2
  margin_top_mm: 1.5
  margin_bottom_mm: 1.5
  content_width_mm: 68         # 72 - 2 - 2

bartender_setup:
  steps:
    - "Open BarTender Designer → File → New → Blank Template"
    - "Printer Setup: Select 'Xprinter XP-P323B' (Seagull driver must be installed)"
    - "Stock: Width = 76 mm, Height = 560 mm (or set to 'Auto' for continuous)"
    - "Media: Type = Continuous; Tracking = None"
    - "Orientation: Portrait"
    - "Margins: Left 2 mm, Right 2 mm, Top 1.5 mm, Bottom 1.5 mm"
    - "Units: mm throughout; DPI = 203 (set in printer properties)"
    - "Font: Use monospace or sans-serif at 7–9 pt for thermal legibility"
    - "Data source: 'Named data sources' — create one named source per field below"
    - "Save as .btw and export a print-schema XML for app integration if required"

jasperreports_dimensions:
  # For the existing JasperReports (JRXML) backend — 1 JR unit = 1/72 inch
  # These replace the current 80 mm (226 JR unit) dimensions
  pageWidth_jr: 204            # 72 mm
  pageHeight_jr: 1588          # ~560 mm
  columnWidth_jr: 192
  leftMargin_jr: 6             # ~2 mm
  rightMargin_jr: 6
  topMargin_jr: 4
  bottomMargin_jr: 4
  detail_band_height_jr: 1489
  # Content-area scale from old 80 mm template: 190/214 ≈ 0.888
  label_column:
    x: 5
    width: 71                  # was 80
  value_column:
    x: 81                      # was 91
    width: 107                 # was 120
  full_width_boxes:
    x: 1
    width: 190                 # was 214
  subreport_element:
    x: 5
    width: 183                 # was 206
  # ChargeParticulars_Subreport internal dimensions
  subreport_page_width_jr: 183
  subreport_column_width_jr: 183

# ─────────────────────────────────────────────────────────────
# SLIP LAYOUT — top to bottom
# Variable fields use the notation  {{ field_name }}
# Static text appears as quoted strings
# ─────────────────────────────────────────────────────────────

layout:

  header:
    type: bordered_box
    height_mm: 21
    elements:
      - type: image
        name: authority_logo
        source: "{{ Logo }}"          # BufferedImage injected by renderer
        position: { x_mm: 2, y_mm: 1, width_mm: 16, height_mm: 18 }
      - type: text
        content: "Notification of Traffic Offence"
        align: center
        bold: true
        font_pt: 10
        position: { x_mm: 20, y_mm: 1, width_mm: 50, height_mm: 10 }
      - type: text
        content: "Issued in terms of"
        align: center
        bold: true
        font_pt: 9
        position: { x_mm: 18, y_mm: 11, width_mm: 52, height_mm: 5 }
      - type: text
        content: "Section 56 Act 51 of 1977"
        align: center
        bold: true
        font_pt: 9
        position: { x_mm: 18, y_mm: 16, width_mm: 52, height_mm: 5 }

  warning_banner:
    type: bordered_box
    height_mm: 10
    elements:
      - type: text
        content: "Warning: Failing to comply with this notification is punishable by a fine or imprisonment or both."
        align: center
        font_pt: 8
        wrap: true

  offence_particulars:
    type: section
    section_label: "Offence Particulars"
    height_mm: 22
    fields:
      - label: "Notice Number:"
        variable: "{{ noticeNumber }}"
      - label: "Date and Time:"
        variable: "{{ datentime }}"
      - label: "Location:"
        variable: "{{ location }}"
        multiline: true
        height_mm: 12

  offender_particulars:
    type: section
    section_label: "Offender Particulars"
    height_mm: 100
    fields:
      - label: "First Name:"
        variable: "{{ firstName }}"
      - label: "Surname:"
        variable: "{{ offenderSurname }}"
      - label: "ID Type:"
        variable: "{{ IdType }}"
      - label: "ID Number:"
        variable: "{{ IdNumber }}"
      - label: "Country of ID Issue:"
        variable: "{{ country_of_issue }}"
      - label: "Date of Birth:"
        variable: "{{ dob }}"
      - label: "Cell Number:"
        variable: "{{ cellNumber }}"
      - label: "Email Address:"
        variable: "{{ EmailAddress }}"
      - label: "Gender:"
        variable: "{{ gender }}"
      - label: "Occupation:"
        variable: "{{ occupation }}"
      - label: "Licence Code:"
        variable: "{{ licenceCode }}"
      - label: "Licence Number:"
        variable: "{{ licenceNumber }}"
      - label: "Residential Address:"
        variable: "{{ residentialaddress }}"
        multiline: true
        height_mm: 18
      - label: "Business Address:"
        variable: "{{ businessaddress }}"
        multiline: true
        height_mm: 13
    footer:
      - type: signature_line
        label: "Offender signature"
        align: right
        width_mm: 38

  vehicle_particulars:
    type: section
    section_label: "Vehicle Particulars"
    height_mm: 24
    fields:
      - label: "Plate Number:"
        variable: "{{ regNo }}"
      - label: "Make:"
        variable: "{{ make }}"
      - label: "Model:"
        variable: "{{ model }}"
      - label: "Colour:"
        variable: "{{ colour }}"
      - label: "Cargo:"
        variable: "{{ cargo }}"

  charge_particulars:
    type: section
    section_label: "Charge Particulars"
    height_mm: 89             # stretches with number of charges
    repeating: true           # one block per charge (subreport / repeating group)
    fields_per_charge:
      - label: "Charge Code:"
        variable: "{{ chargeCode }}"
      - label: "Fine Amount:"
        variable: "{{ fineAmount }}"
      - label: "Charge Description:"
        variable: "{{ chargeLongDescription }}"
        multiline: true
        height_mm: 51
      - label: "Regulation:"
        variable: "{{ spesificRegulation }}"
        multiline: true
        height_mm: 15
      - label: "Alternative charge to charge code:"
        variable: "{{ mainChargeCode }}"

  court_particulars:
    type: section
    section_label: "Court Particulars"
    height_mm: 22
    preamble: "Date and place you are personally to appear in court."
    fields:
      - label: "Court Name:"
        variable: "{{ courtName }}"
      - label: "Court Room:"
        variable: "{{ courtRoom }}"
      - label: "Court Date:"
        variable: "{{ courtDate }}"

  officer_particulars:
    type: section
    section_label: "Officer Particulars"
    height_mm: 27
    fields:
      - label: "Officer Name:"
        variable: "{{ officerName }} {{ officerSurname }}"
      - label: "Issuing Authority:"
        variable: "{{ authority }}"
    footer:
      - type: signature_line
        label: "Officer signature"
        align: right
        width_mm: 38

  payment_particulars:
    type: section
    section_label: "Payment Particulars"
    height_mm: 50
    preamble: "Date and place where admission of guilt fine(s) may be paid to avoid appearance in court."
    fields:
      - label: "Payment Due Date:"
        variable: "{{ paymentduedate }}"
      - label: "Payment Place:"
        variable: "{{ paymentplace }}"
        multiline: true
        height_mm: 29

  qr_footer:
    type: footer
    height_mm: 20
    elements:
      - type: qr_code
        source: "{{ qrCode }}"          # BufferedImage injected by renderer
        position: { x_mm: 2, y_mm: 0, width_mm: 18, height_mm: 18 }
      - type: text
        content: "Use notice no. as reference"
        font_pt: 8
        position: { x_mm: 22, y_mm: 6, width_mm: 44, height_mm: 4 }

# ─────────────────────────────────────────────────────────────
# VARIABLE MANIFEST
# All fields the application must populate before printing
# ─────────────────────────────────────────────────────────────

variables:
  offence:
    - noticeNumber
    - datentime
    - location

  offender:
    - firstName
    - offenderSurname
    - IdType
    - IdNumber
    - country_of_issue
    - dob
    - cellNumber
    - EmailAddress
    - occupation
    - gender
    - licenceCode
    - licenceNumber
    - residentialaddress
    - businessaddress

  vehicle:
    - regNo
    - make
    - model
    - colour
    - cargo

  charges:                     # list — one entry per charge
    - chargeCode
    - fineAmount
    - chargeLongDescription
    - spesificRegulation
    - mainChargeCode

  court:
    - courtName
    - courtRoom
    - courtDate

  officer:
    - officerName
    - officerSurname
    - authority

  payment:
    - paymentduedate
    - paymentplace

  images:
    - Logo                     # java.awt.image.BufferedImage
    - qrCode                   # java.awt.image.BufferedImage

# ─────────────────────────────────────────────────────────────
# DESIGN NOTES
# ─────────────────────────────────────────────────────────────

design_notes:
  - "Do NOT design wider than 72 mm; the XP-P323B media is 76 mm, printable 72 mm."
  - "Do NOT use gap/mark mode — use Continuous thermal mode."
  - "Do NOT design as A4; this is a receipt-length continuous slip."
  - "Section headers are full-width bordered boxes with bold centred text."
  - "Label column: ~25 mm wide; value column: ~38 mm wide."
  - "Font size 9 pt is the minimum for thermal legibility at 203 DPI."
  - "Charge Particulars section must repeat/stretch for multiple charges."
  - "QR code encodes the notice number for cashier/payment scanning."
  - "Logo is injected as a BufferedImage by the Spring Boot renderer — not embedded in the template file."
  - "Officer and offender signature lines are printed blank for wet-ink signing."
